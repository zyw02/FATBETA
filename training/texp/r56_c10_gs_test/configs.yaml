adaptive_region_weight_decay: 0
arch: resnet56
bfat:
  all_bits: true
  ber: 0.01
  ber_base_restricted: 0.005
  ber_msb: 0.01
  dual_bit: false
  enabled: false
  freeze_bn: false
  limit_norm: false
  loss_type: direct_ce
  loss_weight: 1.0
  norm_ratio: 1.0
  projection_base: combined
  projection_mode: orthogonal
  use_restricted_as_base: false
  weight_limit_ratio: 0.5
  weight_relative_limit: false
cooldown_epochs: 0
dataloader:
  batch_size: 128
  dataset: cifar10
  deterministic: true
  num_classes: 10
  path: ./data/cifar10
  workers: 16
decay_epochs: 30
decay_rate: 0.1
device: cuda:0
distributed: false
dropout: 0.0
ema_decay: 0.999
enable_dynamic_bit_training: false
epochs: 150
eval: false
gradient_surgery:
  enabled: true
  limit_norm: false
  norm_ratio: 0.5
  projection_mode: direction
information_distortion_mitigation: false
kd: false
local_rank: 0
log:
  num_best_scores: 3
  print_freq: 20
lr: 0.1
min_lr: 1.0e-05
momentum: 0.9
name: r56_c10_gs_test
num_random_path: 3
opt: sgd
output_dir: training/texp
post_training_batchnorm_calibration: true
pre_trained: false
quan:
  act:
    all_positive: true
    bit: 8
    mode: lsq
    per_channel: false
    symmetric: false
  excepts:
    bn1:
      act:
        bit: null
      weight:
        bit: null
    classifier.1:
      act:
        bit: null
      weight:
        bit: null
    conv1:
      act:
        all_positive: false
        bit: null
      weight:
        bit: null
    excepts_bits_width: 8
    fc:
      act:
        bit: null
      weight:
        bit: null
    features.0.0:
      act:
        all_positive: false
        bit: null
      weight:
        bit: null
    features.0.1:
      act:
        bit: null
      weight:
        bit: null
  weight:
    all_positive: false
    bit: 8
    mode: lsq
    per_channel: false
    symmetric: false
rank: 0
resume:
  lean: true
  path: training/resnet56_c10_fp_checkpoint.pth.tar
scale_gradient: false
sched: cosine
search: false
smoothing: 0
split_aw_cands: false
target_bits:
- 8
- 7
- 6
- 5
- 4
- 3
- 2
thesis_logging:
  enabled: true
  log_frequency: 10
  output_dir: thesis_logs
training_device: gpu
warmup_epochs: 5
warmup_lr: 1.0e-05
weight_decay: 2.5e-05
world_size: 1
