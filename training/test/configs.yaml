adaptive_region_weight_decay: 0
arch: alexnet
cooldown_epochs: 0
dataloader:
  batch_size: 128
  dataset: cifar10
  deterministic: true
  num_classes: 10
  path: ./data/cifar10
  workers: 4
decay_epochs: 30
decay_rate: 0.1
device: cuda:0
distributed: false
dropout: 0.0
ema_decay: 0.9997
enable_dynamic_bit_training: true
epochs: 300
eval: false
fault_aware_training:
  ber: 2e-2
  enabled: true
  schedule:
    enabled: false
    start_epoch: 50
  seed_list_stage2:
  - 42
  seed_list_stage3:
  - 42
  - 100
  - 200
  - 300
  - 400
  - 500
  - 600
  - 700
  - 800
  - 900
  trades:
    alpha: 0.97
    beta: 0.3
    compensation_weight: 0.1
    corrector_anchor_ber: 2e-2
    corrector_ber_buckets:
    - 0.0
    - 2e-2
    - 0.035
    - 5e-2
    - 8e-2
    corrector_direction_deadzone: 0.15
    corrector_fusion_hidden_dim: 128
    corrector_gap_stats_momentum: 0.9
    corrector_logits_feature_dim: 32
    corrector_lr: 0.01
    corrector_max_correction: 3.0
    corrector_rl_gain: 0.7
    corrector_rl_penalty: 0.4
    corrector_start_epoch: 200
    corrector_use_rl_weighted: true
    corrector_weight_ce: 0.5
    corrector_weight_direction: 0.5
    corrector_weight_magnitude: 0.5
    corrector_weight_mse: 1.0
    corrector_weight_sparse: 0.05
    corrector_weight_stability: 0.1
    corrector_wmid_beta: 2.0
    corrector_wmid_tau: 2.0
    entropy_mode: constraint
    entropy_weight: 0.05
    stage2_mix_bers:
    - 3e-2
    stage2_mix_prob: 0.15
    stage3_anchor_ber: 2e-2
    stage3_anchor_prob: 0.25
    use_corrector: true
    use_entropy: true
    use_kl: true
    use_self_compensation: true
information_distortion_mitigation: false
kd: false
local_rank: 0
log:
  num_best_scores: 3
  print_freq: 20
lr: 0.01
min_lr: 0.0
momentum: 0.9
name: test
num_random_path: 3
opt: sgd
output_dir: training
post_training_batchnorm_calibration: true
pre_trained: false
quan:
  act:
    all_positive: true
    bit: 2
    mode: lsq
    per_channel: false
    symmetric: false
  excepts:
    classifier.6:
      act:
        all_positive: false
        bit: null
      weight:
        bit: null
    excepts_bits_width: 8
    features.0:
      act:
        all_positive: false
        bit: null
      weight:
        bit: null
  weight:
    all_positive: false
    bit: 2
    mode: lsq
    per_channel: false
    symmetric: false
rank: 0
resume:
  lean: false
  path: null
scale_gradient: false
sched: cosine
search: false
smoothing: 0.0
split_aw_cands: false
target_bits:
- 6
- 5
- 4
- 3
- 2
training_device: gpu
warmup_epochs: 0
warmup_lr: 0.0
weight_decay: 0.0001
world_size: 1
