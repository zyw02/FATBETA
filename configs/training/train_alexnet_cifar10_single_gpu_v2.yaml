# Experiment name - Single GPU version for 11GB 2080Ti with CIFAR10
# V2: classifier.1 uses dynamic bits [2,3,4,5,6] instead of fixed 8-bit
# V9: 自监督方向+幅度、BER尺度自适应、多阶段fault pattern混合
# Key improvements:
#   1. 流形门控（WM-ID）+ Logits统计 → 主动识别异常形态并自适应量纲；
#   2. 方向二值监督 + 相对幅度回归，避免Δlogits尺度漂移；
#   3. Stage2/Stage3 fault pattern 混合：引入stage2 mix & stage3 anchor；
#   4. 训练/推理一致，corrector仅依赖故障logits + 激活能量
name: test

# Name of output directory. Checkpoints and logs will be saved at `pwd`/output_dir
output_dir: training
training_device: gpu

num_random_path: 3
target_bits: [6, 5, 4, 3, 2]
post_training_batchnorm_calibration: true
# Disable information_distortion_mitigation to save GPU memory
information_distortion_mitigation: false
enable_dynamic_bit_training: true
kd: false

# Dataset loader
dataloader:
  dataset: cifar10
  num_classes: 10
  path: ./data/cifar10
  # Batch size for CIFAR10 on 11GB GPU
  batch_size: 128
  workers: 4
  deterministic: true

resume:
  path: 
  lean: false

log:
  num_best_scores: 3
  print_freq: 20

#============================ Model ============================================

arch: alexnet
pre_trained: false  # No pre-trained weights for CIFAR AlexNet

#============================ Quantization =====================================

# (default for all layers)
quan:
  act: 
    mode: lsq
    bit: 2
    per_channel: false
    symmetric: false
    all_positive: true

  weight: 
    mode: lsq
    bit: 2
    per_channel: false
    symmetric: false
    all_positive: false
  
  excepts:
    excepts_bits_width: 8
    # Specify quantized bit width for some layers (first and last layers)
    # For AlexNet: features.0 (first conv) and classifier.6 (last linear)
    # NOTE: classifier.1 is removed from excepts using "__delete__" so it can be quantized with dynamic bits [2,3,4,5,6]
    # Remove classifier.1 from template.yaml (it's only for MobileNetV2)
    classifier.1: __delete__
    features.0.0: __delete__  # Remove MobileNetV2 specific keys from template
    features.0.1: __delete__
    features.0:  # First conv layer
      act:
        bit: 
        all_positive: false
      weight:
        bit:
    classifier.6:  # Last linear layer (index 6 in classifier Sequential)
      act:
        bit:
        all_positive: false
      weight:
        bit:

#============================ Training / Evaluation ============================

eval: false

epochs: 300  # 两阶段训练：前200个epoch训练主模型，后100个epoch训练corrector
smoothing: 0.0
scale_gradient: false

opt: sgd
# Learning rate for CIFAR10 training
lr: 0.01
momentum: 0.9
weight_decay: 0.0001
adaptive_region_weight_decay: 0

sched: cosine
min_lr: 0.0
decay_rate: 0.1
warmup_epochs: 0
warmup_lr: 0.0
decay_epochs: 30
cooldown_epochs: 0

ema_decay: 0.9997

#============================ Fault-Aware Training (TRADES Style) ================
# 故障感知训练配置（TRADES风格）
# 用于提高模型在单粒子翻转故障下的鲁棒性
# 注意：启用后训练时间会增加约2倍（需要两次forward）
fault_aware_training:
  enabled: true  # 设置为true启用故障感知训练
  ber: 2e-2       # Bit-Error-Rate: 第一阶段（0-199 epoch）使用固定BER=2e-2，单seed
                  # 第二阶段（200-299 epoch）使用BER递进（3e-2到8e-2），多seed
  
  # TRADES损失函数配置
  trades:
    use_kl: true    # 使用KL散度版本（推荐，更符合TRADES原论文）
                     # true: L = L(x_normal, y) + β * KL(p(x_normal), p(x_faulted))
                     # false: L = α * L(x_normal, y) + β * L(x_faulted, y)
    alpha: 0.97     # 正常样本权重（仅当use_kl=false时使用，KL版本中无效）
    beta: 0.3       # KL散度权重（use_kl=true时使用）
                    # 降低到0.3，更保护clean accuracy，避免过度关注KL散度
                    # 较小值（0.3-0.5）：更保护clean accuracy
                    # 较大值（0.5-1.0）：更强调故障鲁棒性
    
    # 信息熵正则化（基于信息论的方法）
    use_entropy: true  # 启用信息熵正则化
                       # 在KL散度基础上添加熵约束，进一步稳定模型行为
    entropy_weight: 0.05  # 熵正则化权重
                          # 降低到0.05，减少熵约束强度，避免过度保守
                          # 较小值（0.05-0.1）：温和约束，不影响主要优化目标
                          # 较大值（0.1-0.2）：更强约束，可能影响clean accuracy
    entropy_mode: "constraint"  # 熵损失模式
                                # "difference": 最小化正常和故障输出的熵差异（更严格，强制完全一致）
                                #               强制故障和正常输出熵完全一致，不允许任何差异
                                #               L_entropy = |H(p_normal) - H(p_faulted)|
                                #               问题：如果正常熵很低，会强制故障熵也低，可能导致过度自信
                                # "constraint": 约束故障下的熵不要太大（更温和，推荐）
                                #               只约束故障熵的上限，允许故障熵小于正常熵
                                #               L_entropy = max(0, H(p_faulted) - H(p_normal))
                                #               优点：允许故障下适度增加不确定性，更合理
                                # "balance": 平衡正常和故障下的熵，同时约束故障熵（折中）
                                #            L_entropy = |H(p_normal) - H(p_faulted)| + 0.5 * max(0, H(p_faulted) - 1.2*H(p_normal))
    
    # 自适应对齐补偿（自感知补偿机制）
    use_self_compensation: true  # 启用自适应对齐补偿
                                 # 通过损失函数让模型自动学习补偿故障的影响
                                 # 直接优化概率分布对齐，无需额外网络结构
    compensation_weight: 0.1     # 补偿损失权重
                                 # 较小值（0.05-0.1）：温和补偿，避免过度约束
                                 # 较大值（0.1-0.2）：更强补偿，可能影响clean accuracy
                                 # 与entropy_weight配合使用，建议总和不超过0.15
    
    # ========== V8输出修正器（流形门控 + Logits统计 + 自监督Δlogits） ==========
    use_corrector: true
    corrector_lr: 0.01
    corrector_start_epoch: 200  # 三阶段训练：
                                # 第一阶段（0-49）：干净训练，不使用fault_injector，corrector不训练
                                # 第二阶段（50-199）：主模型FAT训练，BER=2e-2，单seed=42，corrector不训练（只更新baseline）
                                # 第三阶段（200-299）：主模型固定，corrector训练，BER递进（3e-2到8e-2），多seed轮流
    corrector_use_rl_weighted: true  # 修正成功率加权
    corrector_logits_feature_dim: 32
    corrector_fusion_hidden_dim: 128
    corrector_weight_mse: 1.0        # 主损失：Δlogits 自监督回归
    corrector_weight_ce: 0.5         # 辅助：CrossEntropy，保证分类正确
    corrector_weight_sparse: 0.05    # L1 稀疏约束，鼓励稀疏修正
    corrector_weight_stability: 0.1  # 稳定性约束（正确样本近似恒等）
    corrector_weight_direction: 0.5  # 方向一致性
    corrector_weight_magnitude: 0.5  # 幅度一致性
    corrector_max_correction: 3.0    # 单维最大修正幅度
    corrector_gap_stats_momentum: 0.9  # BER分桶统计的EMA衰减
    corrector_direction_deadzone: 0.15 # 方向判定的零区间
    corrector_anchor_ber: 2e-2         # gap尺度对齐使用的锚点BER
    corrector_ber_buckets: [0.0, 2e-2, 3.5e-2, 5e-2, 8e-2]
    corrector_rl_gain: 0.7
    corrector_rl_penalty: 0.4
    # WM-ID门控参数（B：能量异常检测）
    corrector_wmid_tau: 2.0      # WM-ID阈值（tau）：能量异常>tau时强修正
                                 # 较小值（1.0-2.0）：更敏感，更容易触发修正
                                 # 较大值（2.0-3.0）：更保守，只修正明显异常
    corrector_wmid_beta: 2.0     # WM-ID门控斜率（beta）：控制门控陡峭度
                                 # 较大值（2.0-5.0）：门控更陡峭，接近硬阈值
                                 # 较小值（0.5-2.0）：门控更平滑，修正强度渐变
    
    stage2_mix_prob: 0.15        # Stage2 注入更高BER的概率
    stage2_mix_bers: [3e-2]      # Stage2 混入的额外BER列表
    stage3_anchor_prob: 0.25     # Stage3 使用Stage2锚点BER的概率
    stage3_anchor_ber: 2e-2      # Stage3锚点BER
  # BER调度配置
  schedule:
    enabled: false  # 前两阶段禁用渐进式BER调度
                    # 第三阶段（corrector训练）在代码中动态启用BER递进
    start_epoch: 50  # FAT从第50个epoch开始启动（前50轮干净训练，不启用故障注入）
  
  # Seed配置（三阶段不同策略）
  # 第一阶段（0-49 epoch）：不使用fault_injector，干净训练
  # 第二阶段（50-199 epoch）：单seed（42），用于主模型FAT训练
  # 第三阶段（200-299 epoch）：多seed轮流，用于corrector训练，增加故障模式多样性
  seed_list_stage2: [42]  # 第二阶段：单seed
  seed_list_stage3: [42, 100, 200, 300, 400, 500, 600, 700, 800, 900]  # 第三阶段：10个随机seed（轮流使用）

