# Experiment name - BFAT with CAGrad projection
name: r18_c10_BFAT_0.02_wnorm_0.15

# Name of output directory. Checkpoints and logs will be saved at `pwd`/output_dir
output_dir: training
training_device: gpu

# Basic quantization training with nr_random_sample settings
num_random_path: 3  # Number of random paths for nr_random_sample during training
target_bits: [6, 5, 4, 3, 2]
post_training_batchnorm_calibration: true
information_distortion_mitigation: false
enable_dynamic_bit_training: true
kd: false

# Dataset loader
dataloader:
  dataset: cifar10
  num_classes: 10
  path: ./data/cifar10
  # Batch size for CIFAR10 on 11GB GPU
  batch_size: 128
  workers: 4
  deterministic: true

resume:
  path: 
  lean: false

log:
  num_best_scores: 3
  print_freq: 20

#============================ Model ============================================

arch: resnet18
pre_trained: false  # No pre-trained weights for CIFAR ResNet18

#============================ Quantization =====================================

# (default for all layers)
quan:
  act:
    mode: lsq
    bit: 2
    per_channel: false
    symmetric: false
    all_positive: true

  weight:
    mode: lsq
    bit: 2
    per_channel: false
    symmetric: false
    all_positive: false

  excepts:
    excepts_bits_width: 8
    # Specify quantized bit width for some layers, like this:
    conv1:
      act:
        bit:
        all_positive: false
      weight:
        bit:
    bn1:
      act:
        bit:
      weight:
        bit:
    fc:
      act:
        bit:
      weight:
        bit:

#============================ Training / Evaluation ============================

# Set to true if you want to evaluate trained model with nr_random_sample
eval: false

epochs: 100
smoothing: 0.0
scale_gradient: false

opt: sgd
# Learning rate for CIFAR10 training
lr: 0.1
momentum: 0.9
weight_decay: 0.0001
adaptive_region_weight_decay: 0

sched: cosine
min_lr: 0.0
decay_rate: 0.1
warmup_epochs: 0
warmup_lr: 0.0
decay_epochs: 30
cooldown_epochs: 0

ema_decay: 0.9997
# ============================ BFAT 关键发现============================================
# 目前基本可以确认，limit_norm是有害的，freeze_bn也有害
# ============================ BFAT 关键发现============================================
bfat:
  enabled: true
  
  per_sample_injection: false
  restore_max_bits: true

  dual_bit: false             # 双位翻转模式 (MSB + Secondary MSB)
  only_msb: true             # 仅 MSB 翻转模式
  skip_msb: false             # 跳过 MSB 模式 (翻转除 MSB 外的所有位)
  all_bits: false              # 全位翻转模式 (推荐显式设置为 true 以启用标准随机注入)
  bit_index: null             # 特定位索引进行翻转 (整数，如 0 表示 LSB，null 表示禁用)
  
  # === 故障率 (BER) ===
  ber: 0.02                   # 基础误码率 (用于 all_bits, only_msb, skip_msb, bit_index)
  ber_msb: 0.02               # MSB 的误码率 (仅当 dual_bit: true 时生效)
  ber_secondary_msb: 0.01     # 次高位 (Secondary MSB) 的误码率 (仅当 dual_bit: true 时生效)


  loss_weight: 1.0
  
  loss_type: "direct_ce"

  projection_base: "combined"

  limit_norm: true
  weight_relative_limit: true    # 开启“权重相对限制”开关
  weight_limit_ratio: 0.15       # 推荐值 0.01 (即防御梯度总模长不超过参数总模长的 1%)
  norm_ratio: 0.5                # 当启用weight_relative_limit时，norm_ratio会被忽略
  
  freeze_bn: false
  projection_mode: "direction" 

