# Experiment name - FP32 Baseline for MobileNetV2 (MC) on CIFAR10
# Using main_nude.py for training
name: mc_cifar10_fp32_nude

# Name of output directory
output_dir: training
training_device: gpu

# Disable quantization related dynamic training for baseline
# main_nude.py will see target_bits: [32] and skip quantization injection
num_random_path: 0
enable_dynamic_bit_training: false
target_bits: [32] 
split_aw_cands: false

# Dataset loader
dataloader:
  dataset: cifar10
  num_classes: 10
  path: ./data/cifar10
  batch_size: 128
  workers: 4
  deterministic: true

resume:
  path: 
  lean: false

log:
  num_best_scores: 3
  print_freq: 50

#============================ Model ============================================

arch: mobilenetv2_mc
pre_trained: false

#============================ Quantization (Set to 32-bit/Disabled) ============

quan:
  act: 
    mode: lsq
    bit: 32
  weight: 
    mode: lsq
    bit: 32
  excepts: []

#============================ NUDE Specific (All Disabled for FP32) ============

# These sections ensure main_nude.py doesn't complain and stays in standard FP32 mode
scale_penalty:
  enabled: false

bfat:
  enabled: false
  pbs_enabled: false

#============================ Training / Evaluation ============================

eval: false

epochs: 200
smoothing: 0.0
scale_gradient: false
dropout: 0.2

opt: sgd
lr: 0.1
momentum: 0.9
weight_decay: 0.00004  # 4e-5 for MobileNetV2
adaptive_region_weight_decay: 0

sched: cosine
min_lr: 0.0
decay_rate: 0.1
warmup_epochs: 5
warmup_lr: 0.1
decay_epochs: 30
cooldown_epochs: 0

ema_decay: 0.999
