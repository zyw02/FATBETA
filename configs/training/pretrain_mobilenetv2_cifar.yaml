# Experiment name
name: mobilenetv2_cifar_pretrain

# Name of output directory. Checkpoints and logs will be saved at `pwd`/output_dir
output_dir: training
training_device: gpu

# Dataset loader
dataloader:
  dataset: cifar10
  num_classes: 10
  path: ./data
  batch_size: 128
  workers: 4
  deterministic: true

resume:
  path: 
  lean: false

log:
  num_best_scores: 3
  print_freq: 50

#============================ Model ============================================

arch: mobilenet_v2_cifar
pre_trained: false

#============================ Training / Evaluation ============================

eval: false

epochs: 200
smoothing: 0.1
dropout: 0.2

opt: sgd
lr: 0.05
momentum: 0.9
weight_decay: 0.0005

sched: cosine
min_lr: 0.0001
decay_rate: 0.1
warmup_epochs: 5
warmup_lr: 0.001
decay_epochs: 30
cooldown_epochs: 0

