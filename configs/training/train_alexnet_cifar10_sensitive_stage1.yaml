name: alexnet_cifar10_sensitive_stage1
output_dir: training
training_device: gpu

num_random_path: 3
target_bits: [6, 5, 4, 3, 2]
post_training_batchnorm_calibration: true
information_distortion_mitigation: false
enable_dynamic_bit_training: true
kd: false

# Dataset loader
dataloader:
  dataset: cifar10
  num_classes: 10
  path: ./data/cifar10
  batch_size: 128
  workers: 4
  deterministic: true

resume:
  path:
  lean: false

log:
  num_best_scores: 3
  print_freq: 20

arch: alexnet
pre_trained: false

quan:
  act:
    mode: lsq
    bit: 2
    per_channel: false
    symmetric: false
    all_positive: true
  weight:
    mode: lsq
    bit: 2
    per_channel: false
    symmetric: false
    all_positive: false
  excepts:
    excepts_bits_width: 8
    classifier.1: __delete__
    features.0.0: __delete__
    features.0.1: __delete__
    features.0:
      act:
        bit:
        all_positive: false
      weight:
        bit:
    classifier.6:
      act:
        bit:
        all_positive: false
      weight:
        bit:

eval: false
epochs: 200
smoothing: 0.0
scale_gradient: false

opt: sgd
lr: 0.01
momentum: 0.9
weight_decay: 0.0001
adaptive_region_weight_decay: 0

sched: cosine
min_lr: 0.0
decay_rate: 0.1
warmup_epochs: 0
warmup_lr: 0.0
decay_epochs: 30
cooldown_epochs: 0

ema_decay: 0.9997

fault_aware_training:
  enabled: false
