# Experiment name - FP32 Baseline for MobileNetV2 on CIFAR10
name: mobilenetv2_cifar10_fp32

# Name of output directory
output_dir: training
training_device: gpu

# Disable quantization related dynamic training for baseline
num_random_path: 0
enable_dynamic_bit_training: false
target_bits: [32] 
split_aw_cands: false

# Dataset loader
dataloader:
  dataset: cifar10
  num_classes: 10
  path: ./data/cifar10
  batch_size: 128
  workers: 4
  deterministic: true

resume:
  path: 
  lean: false

log:
  num_best_scores: 3
  print_freq: 50

#============================ Model ============================================

arch: mobilenetv2
pre_trained: false

#============================ Quantization (Set to 32-bit/Disabled) ============

quan:
  act: 
    mode: lsq
    bit: 32
  weight: 
    mode: lsq
    bit: 32

#============================ Training / Evaluation ============================

eval: false

epochs: 200
smoothing: 0.0
scale_gradient: false
dropout: 0.2

opt: sgd
lr: 0.01
momentum: 0.9
weight_decay: 0.000025  # 降低 WD 从 0.0005 到 0.0001
adaptive_region_weight_decay: 0

sched: cosine
min_lr: 0.0
decay_rate: 0.1
warmup_epochs: 0
warmup_lr: 0.1
decay_epochs: 30
cooldown_epochs: 0

ema_decay: 0.999

