# Experiment name - DeiT-Tiny W8A8 quantization training on ImageNet
name: deit_tiny_w8a8_imagenet

# Name of output directory
output_dir: training/deit_tiny
training_device: gpu

# Target bits: fixed at 8-bit
target_bits: [8]
num_random_path: 1
post_training_batchnorm_calibration: true 
information_distortion_mitigation: false
enable_dynamic_bit_training: false
kd: false

# Dataset loader
dataloader:
  dataset: imagenet
  num_classes: 1000
  path: /workspace/FATBETA/data/imagenet
  batch_size: 128
  workers: 16
  deterministic: true

resume:
  path: 
  lean: false # Resume with full optimizer state for AdamW

log:
  num_best_scores: 3
  print_freq: 50

#============================ Model ============================================

arch: deit_tiny_patch16_224
pre_trained: true

#============================ Quantization =====================================

quan:
  act:
    mode: lsq
    bit: 8
    per_channel: false
    symmetric: false
    all_positive: false # GELU outputs can be negative (signed quantization) 

  weight:
    mode: lsq
    bit: 8
    per_channel: false
    symmetric: false
    all_positive: false

  excepts:
    excepts_bits_width: 8
    # LayerNorms are NOT in this list, they are skipped by `find_modules_to_quantize` because they are not in `ops` dict.
    # So we don't need to explicitly exempt them.
    # But we might want to exempt the first patch embedding or last head if needed. 
    # Standard practice: Quantize them to 8-bit is usually fine.
    patch_embed.proj:
      act:
        bit: 8
        all_positive: false 
      weight:
        bit: 8
    head:
      act:
        bit: 8
        all_positive: false
      weight:
        bit: 8
    
#============================ Training / Evaluation ============================

eval: false
epochs: 100
smoothing: 0.1 # Label Smoothing is standard for DeiT
scale_gradient: false

# Optimizer - CRITICAL: AdamW
opt: adamw
lr: 0.0005      # Lower LR for ViT than ResNet (5e-4 is standard for finetuning/training small batch)
momentum: 0.9   # Ignored by AdamW usually, but kept for interface
weight_decay: 0.05 # Higher WD for AdamW/ViT (standard is 0.05)
adaptive_region_weight_decay: 0

sched: cosine
min_lr: 0.000001
decay_rate: 0.1
warmup_epochs: 5
warmup_lr: 0.000001
decay_epochs: 30
cooldown_epochs: 0

ema_decay: 0.9997 # ViT benefits from high EMA decay

# ============================ BFAT ============================================
bfat:
  enabled: false # Start with baseline QAT first
  dual_bit: false
  use_restricted_as_base: false 
  all_bits: true              
  
  ber: 0.01                   
  ber_base_restricted: 0.005   
  
  loss_weight: 1.0
  loss_type: "direct_ce"
  projection_base: "combined"
  limit_norm: false
  weight_relative_limit: false
  weight_limit_ratio: 0.5
  norm_ratio: 1.0
  
  freeze_bn: false
  projection_mode: "orthogonal" 

# ============================ Thesis Logging =================================
thesis_logging:
  enabled: true              
  output_dir: "thesis_logs"   
  log_frequency: 50
