name: alexnet_cifar10_sensitive_stage2
output_dir: training
training_device: gpu

num_random_path: 3
target_bits: [6, 5, 4, 3, 2]
post_training_batchnorm_calibration: true
information_distortion_mitigation: false
enable_dynamic_bit_training: true
kd: false

# Dataset loader
dataloader:
  dataset: cifar10
  num_classes: 10
  path: ./data/cifar10
  batch_size: 128
  workers: 4
  deterministic: true

resume:
  path:
  lean: false

log:
  num_best_scores: 3
  print_freq: 20

arch: alexnet
pre_trained: false

quan:
  act:
    mode: lsq
    bit: 2
    per_channel: false
    symmetric: false
    all_positive: true
  weight:
    mode: lsq
    bit: 2
    per_channel: false
    symmetric: false
    all_positive: false
  excepts:
    excepts_bits_width: 8
    classifier.1: __delete__
    features.0.0: __delete__
    features.0.1: __delete__
    features.0:
      act:
        bit:
        all_positive: false
      weight:
        bit:
    classifier.6:
      act:
        bit:
        all_positive: false
      weight:
        bit:

eval: false
epochs: 0 # Main model training is already done in Stage 1
smoothing: 0.0
scale_gradient: false

opt: adam
lr: 0.0001
momentum: 0.9
weight_decay: 0.0001
adaptive_region_weight_decay: 0

sched: plateau
min_lr: 0.0
decay_rate: 0.1
warmup_epochs: 0
warmup_lr: 0.0
decay_epochs: 30
cooldown_epochs: 0

ema_decay: 0.9997

fault_aware_training:
  enabled: false

sensitive_restorer:
  stage1_epochs: 0
  stage2_epochs: 200  # Total training epochs with progressive BER from 1e-2 to 4e-2
  topk_per_layer: 12  # Increased from 8 to capture more fault patterns
  sensitivity_batches: 50
  baseline_batches: 50
  stage2_ber: 4e-2
  stage2_seed: 42 
  stage2_mix_bers: [3e-2, 4e-2, 5e-2, 8e-2]
  stage2_mix_prob: 0.3
  
  expert_hidden_dim: 128
  
  restorer_lr: 0.001
  kl_div_weight: 0.5
  direction_weight: 0.1
  temperature: 2.0
  
  use_rl_weighted: true
  rl_gain: 0.7
  rl_penalty: 0.4
  
  distill_weight: 0.5
  distill_epochs: 100
  skip_first_last: false
