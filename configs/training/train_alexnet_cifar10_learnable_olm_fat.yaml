name: alexnet_cifar10_learnable_olm_fat_v3
output_dir: training
training_device: gpu

num_random_path: 3
target_bits: [6, 5, 4, 3, 2]
post_training_batchnorm_calibration: true
information_distortion_mitigation: false
enable_dynamic_bit_training: true
kd: false

# Dataset loader
dataloader:
  dataset: cifar10
  num_classes: 10
  path: ./data/cifar10
  batch_size: 128
  workers: 4
  deterministic: true

resume:
  path:
  lean: false

log:
  num_best_scores: 3
  print_freq: 20

arch: alexnet
pre_trained: false

quan:
  act:
    mode: lsq
    bit: 2
    per_channel: false
    symmetric: false
    all_positive: true
  weight:
    mode: lsq
    bit: 2
    per_channel: false
    symmetric: false
    all_positive: false
  excepts:
    excepts_bits_width: 8
    classifier.1: __delete__
    features.0.0: __delete__
    features.0.1: __delete__
    features.0:
      act:
        bit:
        all_positive: false
      weight:
        bit:
    classifier.6:
      act:
        bit:
        all_positive: false
      weight:
        bit:

eval: false
epochs: 200
smoothing: 0.0
scale_gradient: false

opt: sgd
lr: 0.01
momentum: 0.9
weight_decay: 0.0001
adaptive_region_weight_decay: 0

sched: cosine
min_lr: 0.0
decay_rate: 0.1
warmup_epochs: 0
warmup_lr: 0.0
decay_epochs: 30
cooldown_epochs: 0

ema_decay: 0.9997

# Fault-Aware Training (FAT) 配置
# 40轮以后必须开启FAT，故障注入在编码后的值上
fault_aware_training:
  enabled: true
  # BER (Bit-Error-Rate) 配置 - 可配置的故障率
  # 可以设置为固定值或使用调度策略
  ber: 5e-2  # 默认 0.01 (1%)，可修改为其他值如 1e-3, 5e-3, 2e-2 等
  
  # FAT启动调度配置
  # 40轮以后必须开启FAT
  schedule:
    enabled: true
    strategy: "fixed"  # "fixed" 固定BER或 "progressive" 渐进式BER
    start_epoch: 80  # FAT从epoch 40开始（必须设置为40）
    # 如果使用progressive策略，可以设置：
    # initial_ber: 1e-3
    # final_ber: 1e-2
    # warmup_epochs: 20
  
  # TRADES损失配置
  trades:
    use_kl: false  # 使用简单组合还是KL散度
    alpha: 0.6    # normal loss权重
    beta: 1.0     # faulted loss权重
  
  # Learnable OLM相关损失权重（已禁用，不再使用）
  # lrobust_weight: 1.0          # LRobust权重（主要损失）
  # task_loss_weight: 0.3         # 任务损失权重（最大，实际会分阶段调度：0 -> 0.1 -> 0.3）
  # reg_weight: 0.1               # 正则化权重
  # reg_col_weight: 1.0           # 列互斥正则权重
  # reg_row_weight: 1.0           # 行熵正则权重
  # reg_usage_weight: 1.0         # 码字利用率正则权重
  # 性能优化：OLM损失计算和更新频率（每N个batch计算一次，默认3）
  # 只在需要更新OLM参数时计算损失，避免不必要的计算
  # olm_update_freq: 3           # OLM参数更新频率（每3个batch更新一次）
  
  # Search OLM 配置（基于搜索的OLM，从epoch 40开始）
  search_olm:
    # 层名称列表，空列表表示所有量化层
    layer_names: []
    # 更新频率（每N个epoch进行一次OLM搜索）
    update_freq: 10            # 每10个epoch进行一次OLM搜索
    # 优化方法：'greedy' 或 'simulated_annealing'
    method: 'simulated_annealing'
    # 收集分布时的采样数量（-1表示使用全部权重，不采样）
    num_samples: -1            # 使用全部权重统计分布，更准确但稍慢
    # 模拟退火的最大迭代次数
    max_iterations: 3000

# Learnable OLM 配置（已禁用，只使用传统 OLM 搜索）
# learnable_olm:
#   enabled: false  # 已禁用，不再使用 Learnable OLM
#   # 层名称列表，空列表表示所有量化层
#   layer_names: []
#   # 初始化方法（会在epoch 40被传统OLM覆盖）
#   init_method: 'identity'
#   # 初始温度（会自动调度：1.0 -> 0.1 -> 0.01）
#   temperature: 1.0
#   # Straight-through（已不使用，但保留兼容性）
#   use_straight_through: true
#   # OLM优化器学习率（默认 = 模型学习率 × 0.1）
#   lr: 0.001
#   # OLM优化器权重衰减
#   weight_decay: 0.0001

