# Experiment name - Single GPU version for 11GB 2080Ti with CIFAR10
# NOTE: This config is for main_normal.py/process_normal.py + SR-QAT (scale penalty).
# It is copied from train_resnet18_cifar10_single_gpu.yaml to avoid polluting the original config.
name: resnet18_cifar10_single_gpu_normal_srqat

# Name of output directory. Checkpoints and logs will be saved at `pwd`/output_dir
output_dir: training
training_device: gpu

num_random_path: 3
target_bits: [6, 5, 4, 3, 2]
post_training_batchnorm_calibration: true
# Disable information_distortion_mitigation to save GPU memory
information_distortion_mitigation: false
enable_dynamic_bit_training: true
kd: false

# Dataset loader
dataloader:
  dataset: cifar10
  num_classes: 10
  path: ./data/cifar10
  # Batch size for CIFAR10 on 11GB GPU
  batch_size: 128
  workers: 4
  deterministic: true

resume:
  path:
  lean: false

log:
  num_best_scores: 3
  print_freq: 20

#============================ Model ============================================

arch: resnet18
pre_trained: false  # No pre-trained weights for CIFAR ResNet18

#============================ Quantization =====================================

# (default for all layers)
quan:
  act:
    mode: lsq
    bit: 2
    per_channel: false
    symmetric: false
    all_positive: true

  weight:
    mode: lsq
    bit: 2
    per_channel: false
    symmetric: false
    all_positive: false

  excepts:
    excepts_bits_width: 8
    # Specify quantized bit width for some layers, like this:
    conv1:
      act:
        bit:
        all_positive: false
      weight:
        bit:
    bn1:
      act:
        bit:
      weight:
        bit:
    fc:
      act:
        bit:
      weight:
        bit:

#============================ Training / Evaluation ============================

eval: false

# For faster sweep, we use 120 epochs on CIFAR10.
# If you want maximum accuracy, you can set it back to 200.
epochs: 120
smoothing: 0.0
scale_gradient: false

opt: sgd
# Learning rate for CIFAR10 training
# Recommendation:
# - Start with 0.1 (baseline ResNet18 CIFAR recipe with cosine).
# - If SR-QAT causes instability/oscillation, try 0.05.
lr: 0.1
momentum: 0.9
weight_decay: 0.0001
adaptive_region_weight_decay: 0

sched: cosine
min_lr: 0.0
decay_rate: 0.1
warmup_epochs: 0
warmup_lr: 0.0
decay_epochs: 30
cooldown_epochs: 0

ema_decay: 0.9997

#============================ SR-QAT (Scale Penalty) ===========================
# Penalty-based Scale-Constrained QAT (see chat/doc.md)
scale_penalty:
  enabled: true
  # Strength of scale penalty. Start small; tune based on clean accuracy vs fault tolerance.
  lambda_scale: 1e-6
  # Numerical stability in denominator (m_bar^2 + eps)
  eps: 1e-6
  # EMA momentum for positive logit margin (detached)
  margin_momentum: 0.9
  # Start applying SR-QAT after this epoch (0 means from the beginning)
  start_epoch: 0
  # Whether to apply penalty on faulted forward (FAT second forward). Default false to keep EMA stable.
  apply_on_faulted: false
  # Optional: normalize sum(s^2) by number of LSQ layers (default false to match doc)
  normalize_by_num_layers: false


