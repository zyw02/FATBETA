# Experiment name - ResNet20 W8A8 quantization training on CIFAR10
name: r20_c10_gs_bfat_orthogonal

# Name of output directory. Checkpoints and logs will be saved at `pwd`/output_dir
output_dir: training/gs
training_device: gpu

# Target bits: fixed at 8-bit
target_bits: [6,5,4,3,2]
num_random_path: 3
post_training_batchnorm_calibration: true
information_distortion_mitigation: false
enable_dynamic_bit_training: false
kd: false

sensitivity_aware_sampling: false
# Dataset loader
dataloader:
  dataset: cifar10
  num_classes: 10
  path: ./data/cifar10
  batch_size: 128
  workers: 16
  deterministic: true

resume:
  path: training/pre/r20pre/r20pre_checkpoint.pth.tar
  lean: true

log:
  num_best_scores: 3
  print_freq: 20

#============================ Model ============================================

arch: resnet20
pre_trained: false

#============================ Quantization =====================================

quan:
  act:
    mode: lsq
    bit: 8
    per_channel: false
    symmetric: false
    all_positive: true

  weight:
    mode: lsq
    bit: 8
    per_channel: false
    symmetric: false
    all_positive: false

  excepts:
    excepts_bits_width: 8
    # Specified quantized bit width for some layers
    conv1:
      act:
        bit:
        all_positive: false
      weight:
        bit:
    bn1:
      act:
        bit:
      weight:
        bit:
    fc:
      act:
        bit:
      weight:
        bit:

#============================ Training / Evaluation ============================

eval: false
epochs: 150
smoothing: 0
scale_gradient: false

opt: sgd
lr: 0.1
momentum: 0.9
weight_decay: 0.000025
adaptive_region_weight_decay: 0

sched: cosine
min_lr: 0.00001
decay_rate: 0.1
warmup_epochs: 5
warmup_lr: 0.00001
decay_epochs: 30
cooldown_epochs: 0

ema_decay: 0.999

# ============================ BFAT ============================================
bfat:
  enabled: true
  start_epoch: 0          # 建议预热几轮后再开启主动防御，让模型先学点正常的特征
  all_bits: true          # 【核心】GS模式强制全位注入，覆盖所有bit
  ber: 0.01               # 统一注入率 (1%)
  
  loss_weight: 1.0        # 鲁棒性Loss的权重
  projection_mode: "orthogonal" # 【核心】正交投影模式 (可选: direction, none)
  
  # --- 可选的高级参数 (一般默认即可) ---
  limit_norm: false       # 是否限制对抗梯度的模长 (防止梯度爆炸)
  norm_ratio: 0.5         # 如果开启限制，限制为 Clean 梯度的 0.5 倍

# ============================ Thesis Logging (论文实验数据采集) ==============
thesis_logging:
  enabled: false              # 开启后记录论文表格所需数据
  output_dir: "thesis_logs"   # 相对于实验日志目录 (output_dir/name/thesis_logs)
  log_frequency: 10           # 每 N 个 batch 记录一次

